[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-wallpaper"
version = "0.3.2"
description = "Lightweight Windows wallpaper manager with sources and quote overlays"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
windows-wallpaper = "windows_wallpaper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
